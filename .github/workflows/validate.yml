name: Validate OpenCode Configuration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    - name: Run actionlint
      env:
        npm_config_ignore_scripts: 'true'
      run: npx --yes @kjanat/actionlint@1.17.0

    - name: Run CI Quality Gates
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: node scripts/quality-gates.js --workflows --secrets --artifacts --markdown --dependencies

    - name: Run Unit Tests
      run: node --test test/validate.test.js

    - name: Run Skill Health Check
      run: node scripts/skill-health.js --check

    - name: Run OpenCode Validation Script
      run: node scripts/validate-opencode.js

    - name: Prepare OpenCode Plugin Lockfile
      working-directory: .opencode
      run: npm install --package-lock-only --ignore-scripts

    - name: Audit OpenCode Plugin Dependencies
      working-directory: .opencode
      run: npm audit --package-lock-only --audit-level=high
