name: Validate OpenCode Configuration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Unit Tests
      run: node --test test/validate.test.js

    - name: Run OpenCode Validation Script
      run: node scripts/validate-opencode.js
