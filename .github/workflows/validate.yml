name: Validate OpenCode Configuration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    - name: Run Unit Tests
      run: node --test test/validate.test.js

    - name: Run OpenCode Validation Script
      run: node scripts/validate-opencode.js

    - name: Audit OpenCode Plugin Dependencies
      working-directory: .opencode
      run: npm audit --package-lock-only --audit-level=high
